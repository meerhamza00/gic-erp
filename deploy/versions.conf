# Platform versions: the single source of truth for CI, the image build and dev bootstrap.
# Plain KEY=VALUE (sourced by bash, read by GitHub Actions). Bump deliberately, in a PR:
# CI and the image smoke test prove the new combination before it can be released.

# Frappe Framework and ERPNext git tags
FRAPPE_REF=v15.127.1
ERPNEXT_REF=v15.125.0

# Upstream images (frappe_docker). The builder has the toolchain; base is the runtime.
FRAPPE_BUILD_IMAGE=frappe/build:v15.125.0
FRAPPE_BASE_IMAGE=frappe/base:v15.127.1

# Toolchain matching the runtime image (CI uses these)
PYTHON_VERSION=3.11
NODE_VERSION=22
BENCH_VERSION=5.31.1

# Services (ERPNext v15 is supported on MariaDB 10.6)
MARIADB_IMAGE=mariadb:10.6
REDIS_IMAGE=redis:7-alpine
