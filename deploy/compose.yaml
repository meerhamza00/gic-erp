# GICNEXT production stack: one bench, many client sites (multi-tenant).
# Based on frappe_docker compose.yaml + overrides (MIT): mariadb, redis, traefik(-ssl),
# backup-cron, migrator. Images are pinned; the GICNEXT image comes from a GitHub Release.
#
# On the server: /opt/gicnext/compose.yaml + /opt/gicnext/gicnext.conf (chmod 600), run by
# deploy/server/remote-deploy.sh as
#   docker compose --project-name gicnext --env-file gicnext.conf -f compose.yaml up -d
#
# Variables (gicnext.conf, see deploy/server/gicnext.conf.example):
#   GICNEXT_VERSION    image tag, set by each deploy
#   DB_PASSWORD        MariaDB root password (random, generated by bootstrap.sh)
#   SITES_RULE         Traefik rule, one Host() per client site
#   LETSENCRYPT_EMAIL  for free Let's Encrypt certificates
#   COMPOSE_PROFILES   "proxy" on servers (Traefik on 80/443); empty in CI

x-gicnext-image: &gicnext_image
  image: gicnext/gic-erp:${GICNEXT_VERSION:?GICNEXT_VERSION not set}
  pull_policy: never # loaded from the release tarball, never pulled
  restart: unless-stopped

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-backend-defaults: &backend_defaults
  <<: [*depends_on_configurator, *gicnext_image]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  # ---------------------------------------------------------------- edge
  traefik:
    image: traefik:v3.7.19
    profiles: [proxy]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog=true
      - --log.level=INFO
      # No dashboard / API: nothing to protect, nothing to leak.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - cert-data:/certificates

  frontend:
    <<: *gicnext_image
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-172.16.0.0/12}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    labels:
      - traefik.enable=true
      - traefik.http.services.gicnext.loadbalancer.server.port=8080
      - traefik.http.routers.gicnext.rule=${SITES_RULE:-Host(`localhost`)}
      - traefik.http.routers.gicnext.entrypoints=https
      - traefik.http.routers.gicnext.tls.certresolver=le
    depends_on:
      - backend
      - websocket

  # ---------------------------------------------------------------- app
  configurator:
    <<: *gicnext_image
    restart: on-failure
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  migrator:
    <<: *backend_defaults
    restart: "no" # a failed migration must fail the deploy (remote-deploy.sh rolls back)
    entrypoint: [bash, -c]
    command:
      - >
        if [ -z "$$(find sites -mindepth 2 -maxdepth 2 -name site_config.json 2>/dev/null)" ]; then
          echo "[migrator] No sites yet, nothing to migrate"; exit 0;
        fi;
        bench --site all migrate

  backend:
    <<: *backend_defaults
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: "120"

  websocket:
    <<: [*depends_on_configurator, *gicnext_image]
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  queue-short:
    <<: *backend_defaults
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    command: bench worker --queue long,default,short

  scheduler:
    <<: *backend_defaults
    command: bench schedule
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.site-backups.schedule: ${BACKUP_CRONSTRING:-@every 6h}
      ofelia.job-exec.site-backups.command: bench --site all backup
      ofelia.job-exec.site-backups.user: frappe

  # Runs the backup job above inside the scheduler container.
  backup-cron:
    image: mcuadros/ofelia:309df2f # v0.3.23
    restart: unless-stopped
    command: daemon --docker
    depends_on:
      - scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------- data
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
  cert-data:
