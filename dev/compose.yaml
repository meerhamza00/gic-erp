# Local dev stack for GICNEXT (Frappe v15 + ERPNext v15).
#
# Layout: this repo is cloned at <workspace>/development/frappe-bench/apps/gic_erp, and the
# whole <workspace>/development folder is mounted into the container, so the bench and
# this app stay editable from the host. dev/scripts/bootstrap.sh creates that layout.
#
# Dev-only passwords are random files in dev/.secrets (gitignored, created by bootstrap),
# mounted as Docker secrets. Never reuse them in production.
name: gic-erp-dev

secrets:
  db_root_password:
    file: ${GIC_DEV_SECRETS:-./.secrets}/db_root_password
  admin_password:
    file: ${GIC_DEV_SECRETS:-./.secrets}/admin_password

services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_root_password]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  redis-cache:
    image: redis:8-alpine

  redis-queue:
    image: redis:8-alpine

  frappe:
    image: frappe/bench:latest
    command: sleep infinity
    working_dir: /workspace/development
    environment:
      SHELL: /bin/bash
    secrets: [db_root_password, admin_password]
    volumes:
      # dev/ -> gic_erp -> apps -> frappe-bench -> development
      - ../../../..:/workspace/development:cached
      - ./my.cnf:/home/frappe/.my.cnf:ro
    ports:
      - "${GIC_DEV_PORT:-8000}:8000"
      - "${GIC_DEV_SOCKETIO_PORT:-9000}:9000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  mariadb-data:
