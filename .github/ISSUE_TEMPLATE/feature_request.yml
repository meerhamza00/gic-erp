name: Feature request
description: Suggest a feature or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: industry
    attributes:
      label: Industry
      multiple: true
      options:
        - Foundry & Cookware
        - Mandi & Wholesale Trader
        - Importer & Exporter
        - Sanitary Ware & Ceramics
        - All
