# Every PR and every push to main: lint, security, and the Frappe test suite on a real bench.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (same hooks as on the laptop)
        run: |
          pip install pre-commit==4.5.1
          SKIP=no-push-to-main,gitleaks pre-commit run --all-files --show-diff-on-failure --color=always

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: PR title is a Conventional Commit (it becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          if [[ "$TITLE" =~ $re ]]; then echo "OK: $TITLE"; else
            echo "::error::PR title must look like 'feat: add X' or 'fix(fbr): Y'. Got: $TITLE"; exit 1
          fi

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just this commit
          persist-credentials: false
      - name: gitleaks (secrets in any commit)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: bandit (Python security lint)
        run: |
          pip install "bandit[toml]==1.9.4"
          bandit -c pyproject.toml -r gic_erp -ll

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SITE: test_site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: gic_erp

      - name: Pins and secrets
        run: |
          set -a; . gic_erp/deploy/versions.conf; set +a
          for k in FRAPPE_REF ERPNEXT_REF PYTHON_VERSION NODE_VERSION BENCH_VERSION MARIADB_IMAGE REDIS_IMAGE; do
            echo "$k=${!k}" >> "$GITHUB_ENV"
          done
          db_password="$(openssl rand -hex 24)"; admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$db_password"; echo "::add-mask::$admin_password"
          { echo "DB_PASSWORD=$db_password"; echo "ADMIN_PASSWORD=$admin_password"; } >> "$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/yarn
          key: bench-${{ runner.os }}-${{ env.FRAPPE_REF }}-${{ env.ERPNEXT_REF }}-${{ hashFiles('gic_erp/pyproject.toml') }}

      - name: Start MariaDB and Redis
        run: |
          docker run -d --name mariadb -p 3306:3306 -e MARIADB_ROOT_PASSWORD="$DB_PASSWORD" \
            "$MARIADB_IMAGE" --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          docker run -d --name redis-cache -p 13000:6379 "$REDIS_IMAGE"
          docker run -d --name redis-queue -p 11000:6379 "$REDIS_IMAGE"
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client >/dev/null
          for _ in $(seq 1 60); do
            mariadb -h 127.0.0.1 -uroot -p"$DB_PASSWORD" -e 'select 1' >/dev/null 2>&1 && break
            sleep 2
          done
          mariadb -h 127.0.0.1 -uroot -p"$DB_PASSWORD" -e 'select version()'

      - name: Bench with Frappe, ERPNext and gic_erp
        run: |
          npm install -g yarn@1.22.22
          pip install "frappe-bench==$BENCH_VERSION"
          bench init frappe-bench --frappe-branch "$FRAPPE_REF" --python "$(which python)" \
            --skip-redis-config-generation --skip-assets --no-procfile --no-backups
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch "$ERPNEXT_REF" --skip-assets erpnext
          bench get-app --skip-assets gic_erp "$GITHUB_WORKSPACE/gic_erp"

      - name: Test site
        working-directory: frappe-bench
        run: |
          bench new-site "$SITE" --db-root-password "$DB_PASSWORD" --admin-password "$ADMIN_PASSWORD" \
            --mariadb-user-host-login-scope=% --install-app erpnext --install-app gic_erp
          bench --site "$SITE" set-config allow_tests true
          bench build --app gic_erp

      - name: Run gic_erp tests
        working-directory: frappe-bench
        run: bench --site "$SITE" run-tests --app gic_erp

      - name: Logs on failure
        if: failure()
        run: |
          tail -n 100 frappe-bench/logs/*.log 2>/dev/null || true
          docker logs mariadb 2>&1 | tail -n 30
